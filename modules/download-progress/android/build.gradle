plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'repuber.downloadprogress'
version = '1.0.0'

android {
  namespace "expo.modules.downloadprogress"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Same OkHttp as React Native, so the app doesn't pull a second major version.
  implementation "com.squareup.okhttp3:okhttp:4.9.2"
}
